<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portal interno de herramientas operativas de Ambit Data Studio.">
    <title>Ambit Data Studio</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
  </head>
  <body>
    <a class="skip-link" href="#contenido">Ir al contenido principal</a>

    <header class="site-header">
      <div class="container header-content">
        <a class="brand" href="index.html" aria-label="Ambit Data Studio, inicio">
          <img src="assets/ambit-logo.png" alt="Ambit" width="202" height="60">
          <span class="product-name">Data Studio</span>
        </a>
        <span class="environment-label">Portal interno</span>
      </div>
    </header>

    <main id="contenido">
      <section class="workspace" aria-labelledby="tools-title">
        <div class="container">
          <div class="section-heading">
            <h1 id="tools-title">Herramientas</h1>
            <p>Selecciona una herramienta para comenzar. Las funciones estarán disponibles cuando finalice su definición.</p>
          </div>

          <div class="tools-panel">
            <div class="tools-header" aria-hidden="true">
              <span>Herramienta</span>
              <span>Estado</span>
              <span>Acción</span>
            </div>
            <div id="module-list" class="module-list" aria-live="polite"></div>
          </div>

          <noscript>
            <p class="notice">Activa JavaScript para visualizar el catálogo de módulos.</p>
          </noscript>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-content">
        <p>Ambit Data Studio</p>
        <p>Portal interno · Los módulos aún no están desarrollados</p>
      </div>
    </footer>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
